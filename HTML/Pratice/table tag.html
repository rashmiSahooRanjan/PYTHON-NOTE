<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    <table> = create a table
    <caption> = it is used to table title
    <thead> = it is used for table header
    <tbody>= it is used for main table data
    <tfoot> = it is used for table footer
    <tr> -= it is used for table row
    <td> = it is used for table data cell
    <colgroup> = it is used to group table columns
    <col> = it is used for defines properties for columns
    -->
    <table border="1">
    <caption>Student Details</caption>

    <thead>
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Rahul</td>
            <td>21</td>
        </tr>

        <tr>
            <td>Riya</td>
            <td>20</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="2">Total Students: 2</td>
        </tr>
    </tfoot>
</table>


</body>
</html>
