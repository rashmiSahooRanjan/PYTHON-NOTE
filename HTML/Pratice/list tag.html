<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--  ul tag :- it is used to create the unordered list -->
      <ul>how to become a software developer
      <li>DSA</li>
      <li>HTML</li>
      <li>CSS</li>
      </ul>

    <!-- Ol tag:- it is used to create the list in the oreder format -->
     <ol>how to prepare rice
        <li>take the rice</li>
        <li>heat the water</li>
        <li>put the water on rice</li>

     </ol>

    <!-- Description tag:- 
    dl =description list
    dt =description term
    dd =description details
    
    -->
    <dl>
    <dt>HTML</dt>
    <dd>Used to create webpage structure.</dd>

    <dt>CSS</dt>
    <dd>Used to style webpages.</dd>
</dl>


</body>
</html>
