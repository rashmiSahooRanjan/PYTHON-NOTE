<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- Img tag:- it is used to display the image -->
     <img src="./Studentmangmentsystem.jpg" alt="Student Management System" width="500" height="300">
    <br>

    <!-- figure tag, figcaption tag :- it is used to groups media or content with caption-->
     <figure>
          <figcaption>Student Management System</figcaption>
        <img src="./Studentmangmentsystem.jpg" alt="Student Management System" width="500" height="300">
     </figure>

     <!-- Audio Tag :- it is used to add the audio  -->
      <p> it is the audio tag <audio controls>
        <source src="./Audio.mp3" type="audio/mpeg">
      </audio></p>

      <!-- video tag:- it is used to add the video -->
       <p> it is the video tag
        <video controls width="500" height="300">
            <source src="./Video.mp4" type="video/mp4">
        </video>
       </p>

       <!-- map tag :- it is used to creates an image map -->
    <!-- area tag :- it is used to clikable area inside the image. if i clikon image thengo to another page -->
       <p> it is the map tag
        <map name="studentMap">
            <area shape="rect" coords="0,0,100,100" alt="Area 1" href="./Anchor Tag.html">
            <area shape="circle" coords="150,150,50" alt="Area 2" href="./Paragraph tag.html">
        </map>
        <img src="./Studentmangmentsystem.jpg" alt="Student Management System" width="500" height="300" usemap="#studentMap">
       </p>


</body>
</html>
